<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>make.fun bounties</title>
</head>
<body>
<header class="topbar">
  <a class="logo" href="#/">make<i>.fun</i> bounties</a>
  <nav><a href="#/">Board</a></nav>
  <form id="profileLookup">
    <input id="handleInput" type="text" placeholder="Profile handle, e.g. superskie" aria-label="Profile handle">
    <button type="submit">Profile</button>
  </form>
</header>
<main id="app"></main>
<script>
window.__shotReady = false;
import('./board.js');
</script>
<style>
:root{color-scheme:light;--bg:#f5f5f7;--panel:#fff;--p2:#eeeef3;--text:#16161d;--mu:#5d5d6e;--ac:#e0218a;--a2:#f04e23;--red:#d61f1f;--bd:1px solid #d9d9e2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,sans-serif}
a{color:var(--ac);text-decoration:none}
button,input,select{font:inherit;color:var(--text)}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 18px;background:var(--panel);border-bottom:var(--bd)}
.logo{font-size:19px;font-weight:800;color:var(--text)}
.logo i{font-style:normal;color:var(--ac)}
.topbar form{display:flex;gap:6px;margin-left:auto}
.topbar input,.search,.sortsel{background:var(--p2);border:var(--bd);border-radius:9px;padding:7px 11px}
.topbar form button{background:var(--p2);border:var(--bd);border-radius:9px;padding:7px 13px;cursor:pointer;font-weight:600}
main{max-width:1240px;margin:0 auto;padding:16px 18px 48px}
.shell{display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px;align-items:start}
#view{min-width:0}
#rail{position:sticky;top:64px}
.rail-list{display:grid;gap:10px;max-height:calc(100vh - 285px);overflow:auto;padding:2px}
.tabs,.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips{margin-bottom:10px}
.card{background:var(--panel);border:var(--bd);border-radius:12px;padding:12px 14px;cursor:pointer}
.closing-soon-badge{display:inline-block;background:var(--red);color:#fff;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;vertical-align:2px}
.card .pot .closing-soon-badge{color:#fff;font-weight:800}
</style>
</body>
</html>
